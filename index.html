<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alpha Motors — автомобили</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f4f3;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 400px;
            padding: 40px 25px;
            box-sizing: border-box;
            background: white;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .avatar {
            display: block;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }

        .description {
            margin-bottom: 25px;
            color: #555;
            font-size: 17px;
            line-height: 1.4;
        }

        .whatsapp,
        .instagram {
            display: block;
            padding: 17px;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
        }

        .whatsapp {
            background: #25D366;
        }

        .instagram {
            margin-top: 12px;
            background: linear-gradient(
                135deg,
                #833AB4,
                #E1306C,
                #F77737
            );
        }

        .note {
            margin-top: 18px;
            color: #777;
            font-size: 14px;
            line-height: 1.4;
        }

        .footer {
            margin-top: 20px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="card">

        <img
            class="avatar"
            src="alpha-motors-logo.jpeg"
            alt="Логотип Alpha Motors"
        >

        <h1>Alpha Motors</h1>

        <div class="description">
            НОВЫЕ И Б/У автомобили без ПВ
        </div>

        <a
            class="whatsapp"
            href="https://wa.me/77073486747"
        >
            💬 Написать в WhatsApp
        </a>

        <a
            class="instagram"
            href="https://www.instagram.com/alphamotors__zhezkazgan"
        >
            📸 Перейти в Instagram
        </a>

        <div class="note">
    Если WhatsApp не открывается, нажмите на три точки сверху
    и выберите «Открыть в браузере».
</div>

        <div class="footer">
            Alpha Motors · Жезказган
        </div>

    </div>
</body>
</html>
