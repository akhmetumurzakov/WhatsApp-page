<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ахмет — автомобили</title>
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f2f4f3;
    font-family: Arial, sans-serif;
}
.card {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 40px 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    box-sizing: border-box;
}
.avatar {
    width: 85px;
    height: 85px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #25D366;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: bold;
}
h1 {
    margin: 0 0 12px;
    font-size: 30px;
}
.description {
    color: #555;
    font-size: 17px;
    line-height: 1.4;
    margin-bottom: 25px;
}
.whatsapp {
    display: block;
    padding: 17px;
    background: #25D366;
    color: white;
    text-decoration: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: bold;
}
.note {
    margin-top: 18px;
    color: #777;
    font-size: 14px;
    line-height: 1.4;
}
.footer {
    margin-top: 20px;
    color: #aaa;
    font-size: 12px;
}
</style>
</head>
<body>
<div class="card">
    <div class="avatar">А</div>
    <h1>Ахмет</h1>
    <div class="description">
        НОВЫЕ И Б/У автомобили без ПВ
    </div>
    <a class="whatsapp" href="https://wa.me/77073486747">
        💬 Написать в WhatsApp
    </a>
    <div class="note">
        Если WhatsApp не открывается внутри TikTok,
        откройте эту страницу в Safari и нажмите кнопку ещё раз.
    </div>
    <div class="footer">
        Свяжитесь со мной в WhatsApp
    </div>
</div>
</body>
</html>
